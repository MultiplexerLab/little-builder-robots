name: little_builder_robots
description: "Little Builder Robots: an offline robot-building game for children aged 3 to 7."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  # Game data (NFR-15). Each world folder is listed so new course files are
  # picked up without code changes.
  assets:
    - assets/data/
    - assets/data/world1/
    # Audio clips (AUD-01, AUD-02). Missing clips are skipped at run time.
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/voice/en_GB/

  # Bundled fonts only (PRV-03). Both are SIL OFL 1.1 variable fonts; the
  # weight is set with font variations in lib/app/theme.dart (DES-02).
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
